name: perf-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enforce p95 frame-time budget
        run: node scripts/perf-gate.mjs --log games/starter/frame-log.json --budget-ms 16.67
